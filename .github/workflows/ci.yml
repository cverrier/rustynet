name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d # v2.0.4
        with:
          install-only: true
          prek-version: "0.4.1"
      - name: File hygiene
        run: prek run --all-files --hook-stage pre-commit --show-diff-on-failure --color=always
        env:
          SKIP: cargo-fmt,cargo-clippy,no-commit-to-branch

      # Toolchain version + components (rustfmt, clippy) come from
      # rust-toolchain.toml. Install it explicitly before the cache: the cache
      # plugin keys on the current rustc version, so the toolchain must exist
      # first.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose
